<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilusión Rock | Tienda Oficial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-dark bg-black border-bottom border-secondary sticky-top px-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-uppercase" href="#">
        ⚡ Ilusión <span class="text-danger">Rock</span>
      </a>
      <button class="btn btn-outline-danger position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#panelCarrito">
        🛒 Carrito
        <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          0
        </span>
      </button>
    </div>
  </nav>

  <header class="container my-4 text-center">
    <h1 class="display-5 fw-bold">Indumentaria & Accesorios Rock</h1>
    <p class="text-secondary">Elegí tus prendas, armá tu carrito y confirmá tu pedido online</p>

    <div class="row g-2 justify-content-center mt-4">
      <div class="col-md-4">
        <input type="text" id="input-busqueda" class="form-control bg-dark text-light border-secondary" placeholder="Buscar prenda o banda...">
      </div>
      <div class="col-md-3">
        <select id="select-categoria" class="form-select bg-dark text-light border-secondary">
          <option value="todos">Todas las categorías</option>
          <option value="remeras">Remeras</option>
          <option value="abrigos">Abrigos</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <div id="estado-carga" class="text-center my-5">
      <div class="spinner-border text-danger" role="status"></div>
      <p class="mt-2">Cargando catálogo de Ilusión Rock...</p>
    </div>

    <div id="contenedor-productos" class="row g-4"></div>
  </main>

  <aside class="offcanvas offcanvas-end bg-dark text-light border-start border-secondary" tabindex="-1" id="panelCarrito">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title fw-bold">Tu Pedido - Ilusión Rock</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <div id="contenedor-carrito" class="mb-3"></div>

      <div id="seccion-checkout" class="border-top border-secondary pt-3 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fs-5">Total a pagar:</span>
          <strong id="precio-total" class="fs-4 text-danger">$0</strong>
        </div>

        <form id="form-compra" class="mb-3">
          <h6 class="text-secondary mb-2">Datos para finalizar el pedido</h6>
          <div class="mb-2">
            <input type="text" id="cliente-nombre" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Tu nombre completo" required>
          </div>
          <div class="mb-2">
            <input type="email" id="cliente-email" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Tu correo electrónico" required>
          </div>
          <div class="mb-3">
            <select id="cliente-entrega" class="form-select form-select-sm bg-black text-light border-secondary">
              <option value="Retiro en local">Retiro en local (Sin cargo)</option>
              <option value="Envío a domicilio">Envío a domicilio</option>
            </select>
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold mb-2">Confirmar Compra</button>
        </form>

        <button id="btn-vaciar-carrito" type="button" class="btn btn-outline-secondary btn-sm w-100">
          Vaciar carrito
        </button>
      </div>
    </div>
  </aside>

  <footer class="bg-black text-center text-secondary py-3 mt-5 border-top border-secondary">
    <small>Ilusión Rock © 2026 - Proyecto Final JavaScript</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/api.js"></script>
  <script src="./js/carrito.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
